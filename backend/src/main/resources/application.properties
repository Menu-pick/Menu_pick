spring.application.name=backend

# MySQL 연결
spring.datasource.url=jdbc:mysql://localhost:3306/menupick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정. 개발 중에는 엔티티 기준으로 테이블 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# data.sql 초기 데이터 실행 (테이블 생성 이후에 실행되도록 지연)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# CORS 허용 주소 (프론트 로컬 개발 서버)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Kakao 지도 REST API KEY
kakao.rest-api-key=${KAKAO_REST_API_KEY}
