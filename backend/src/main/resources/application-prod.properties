# 서버(prod) 전용 설정. SPRING_PROFILES_ACTIVE=prod 일 때 application.properties 위에 덮어씀
# 실제 값은 서버 ~/bobpick/.env 에만 둡니다.

# DB: docker compose 안의 db 컨테이너로 접속
spring.datasource.url=jdbc:mysql://db:3306/menupick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

# 서버에서는 SQL 로그 끄기
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS 허용 주소 (배포된 프론트 주소 + 로컬 개발)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# nginx 뒤에서 https 로 인식하도록
server.forward-headers-strategy=framework
